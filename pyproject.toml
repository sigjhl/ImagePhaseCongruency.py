[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phasecongruency"
version = "0.2.3"
description = "Phase based feature detection and image enhancement"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peter Kovesi"},
]
maintainers = [
    {name = "sigjhl"},
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]
keywords = ["image-processing", "phase-congruency", "feature-detection", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/sigjhl/ImagePhaseCongruency.py"
Repository = "https://github.com/sigjhl/ImagePhaseCongruency.py"
Issues = "https://github.com/sigjhl/ImagePhaseCongruency.py/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["phasecongruency*"]
exclude = ["tests*", "tmp*"]
