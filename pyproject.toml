[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phasecongruency"
version = "0.2.3"
description = "Phase based feature detection and image enhancement"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Peter Kovesi"},
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["phasecongruency*"]
